name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          # Install dependencies (will create package-lock.json if missing)
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_API_BASE_URL secret is not set!"
            echo "Please go to: Settings → Secrets and variables → Actions"
            echo "Add secret: NEXT_PUBLIC_API_BASE_URL = https://your-backend.railway.app/api"
            echo "See GITHUB_SECRETS_QUICK_SETUP.md for instructions"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_API_BASE_URL is set"

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME || '' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
