[phases.setup]
nixPkgs = ["nodejs_20", "chromium"]

[phases.install]
cmds = [
  "cd backend",
  "npm ci --include=dev --workspaces=false || npm install --include=dev --workspaces=false"
]

[phases.build]
cmds = [
  "cd backend",
  "npm run build"
]

[start]
cmd = "cd backend && npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"


