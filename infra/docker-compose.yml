version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rocket-gifts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rocket_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: rocket_gifts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocket_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rocket-gifts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

